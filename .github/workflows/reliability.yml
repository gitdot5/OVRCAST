name: Reliability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode 26 or newer
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_26.3.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          swift --version
      - run: python3 -m unittest discover -s tests
      - run: swift test --package-path native -j 2
      - run: python3 script/export_source.py
  package:
    name: Universal package contract
    needs: tests
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      OVRCAST_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Build from the private-data allowlist
        run: ./script/package_release.sh --zip-only
      - name: Verify universal bundle and exercise collector resources
        run: python3 script/verify_release.py dist/OVRCAST-*-preview.app.zip
